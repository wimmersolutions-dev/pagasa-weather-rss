name: PAGASA Weather

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 9 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run PAGASA scraper
        run: |
          python scraper.py

      - name: Save RSS feed
        run: |
          git config user.name "PAGASA Weather Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml

          git diff --cached --quiet || git commit -m "Update PAGASA weather"

          git push
 
