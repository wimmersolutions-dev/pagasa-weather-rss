name: PAGASA Weather

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 9 * * *"

concurrency:
  group: pagasa-weather
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run PAGASA scraper
        run: |
          python scraper.py

      - name: Save RSS feed
        run: |
          git config user.name "PAGASA Weather Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml

          if git diff --cached --quiet; then
            echo "No changes to feed.xml"
            exit 0
          fi

          git commit -m "Update PAGASA weather"

          git pull --rebase origin main

          git push origin main
